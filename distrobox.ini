# =====================================================================
# Distrobox-Manifest für die DRV eAntrag Laufzeitumgebung
# =====================================================================
# Die Startskripte kommen mit dem Image mit. Der normale Host-Home bleibt der persistente
# Datenbereich, den Distrobox standardmäßig mountet.
# Ein Alias namens "start" wird direkt im Container-Home angelegt, damit der Nutzer ohne
# Terminal-Details nur einen kurzen Befehl ausführen muss.

[drv-eantrag]
image=ghcr.io/drv-eantrag-distrobox/drv-eantrag-distrobox:latest
replace=true
home=/home/$USER
init_hooks="mkdir -p ~/.local/bin && ln -sf /usr/local/bin/start_eantrag_sandbox.sh ~/.local/bin/start && ln -sf /usr/local/bin/start_eantrag_dark.sh ~/.local/bin/start_eantrag_dark.sh && ln -sf /usr/local/bin/start_eantrag_light.sh ~/.local/bin/start_eantrag_light.sh && ln -sf /usr/local/bin/ea_clipboard_helper.sh ~/.local/bin/ea_clipboard_helper.sh && ln -sf /usr/local/bin/configure_credentials.sh ~/.local/bin/configure_credentials.sh"
