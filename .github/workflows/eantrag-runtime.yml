name: eAntrag runtime build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TARGET_JAVA_VERSION: '21'
  TARGET_UBUNTU_CODENAME: 'jammy'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/drv-eantrag-distrobox

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Java target on runner
        run: |
          java -version 2>&1 | tee /tmp/java-runner-version.txt
          if ! grep -q '"${{ env.TARGET_JAVA_VERSION }}' /tmp/java-runner-version.txt; then
            echo "Java version mismatch: expected ${{ env.TARGET_JAVA_VERSION }}"
            exit 1
          fi

      - name: Extract tagged version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image locally for smoke test
        run: |
          docker build \
            --build-arg JAVA_VERSION=${{ env.TARGET_JAVA_VERSION }} \
            --build-arg UBUNTU_CODENAME=${{ env.TARGET_UBUNTU_CODENAME }} \
            --build-arg EANTRAG_VERSION=${{ steps.version.outputs.value }} \
            --tag eantrag-runtime:test \
            .

      - name: Smoke test image
        run: |
          docker run --rm eantrag-runtime:test java -version 2>&1 | tee /tmp/java-image-version.txt
          grep -q '"${{ env.TARGET_JAVA_VERSION }}' /tmp/java-image-version.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          build-args: |
            JAVA_VERSION=${{ env.TARGET_JAVA_VERSION }}
            UBUNTU_CODENAME=${{ env.TARGET_UBUNTU_CODENAME }}
            EANTRAG_VERSION=${{ steps.version.outputs.value }}
