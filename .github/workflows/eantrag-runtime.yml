name: eAntrag runtime build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  TARGET_JAVA_VERSION: '21'
  TARGET_UBUNTU_CODENAME: 'jammy'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/drv-eantrag-distrobox

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Show runner Java (informational)
        run: |
          echo "Runner Java (informational):"
          java -version || true

      - name: Extract tagged version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image with buildx for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            eantrag-runtime:test
          load: true
          build-args: |
            JAVA_VERSION=${{ env.TARGET_JAVA_VERSION }}
            UBUNTU_CODENAME=${{ env.TARGET_UBUNTU_CODENAME }}
            EANTRAG_VERSION=${{ steps.version.outputs.value }}

      - name: Smoke test image (run java -version inside image)
        run: |
          docker run --rm eantrag-runtime:test java -version 2>&1 | tee /tmp/java-image-version.txt
          echo "--- image java version ---"
          cat /tmp/java-image-version.txt
          if ! grep -q '"${{ env.TARGET_JAVA_VERSION }}' /tmp/java-image-version.txt; then
            echo "Java version mismatch inside image: expected ${{ env.TARGET_JAVA_VERSION }}"
            exit 1
          fi

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eantrag-diagnostic-logs
          path: /tmp/java-image-version.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          build-args: |
            JAVA_VERSION=${{ env.TARGET_JAVA_VERSION }}
            UBUNTU_CODENAME=${{ env.TARGET_UBUNTU_CODENAME }}
            EANTRAG_VERSION=${{ steps.version.outputs.value }}
